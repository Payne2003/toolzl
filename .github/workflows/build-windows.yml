name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "zalo_marketing/**"
      - "packaging/**"
      - "run_app.py"
      - "requirements*.txt"
      - "CHANGELOG.md"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c 'import zalo_marketing as z; print(z.__version__)')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} không khớp __version__ = $v"; exit 1
          fi

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/ZaloMarketing.spec --noconfirm --clean

      - name: Smoke test (exe starts)
        shell: pwsh
        run: |
          $env:ZALO_MARKETING_HOME = "$env:RUNNER_TEMP\zm"
          $p = Start-Process -FilePath "dist\ZaloMarketing\ZaloMarketing.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "ZaloMarketing.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\ZaloMarketing\* -DestinationPath "dist\ZaloMarketing-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ZaloMarketing-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/ZaloMarketing-Setup-*.exe
            dist/ZaloMarketing-Portable-*.zip

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=${{ steps.ver.outputs.version }}
          awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > CHANGELOG_RELEASE.md || true
          [ -s CHANGELOG_RELEASE.md ] || echo "Phiên bản $v" > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Zalo Marketing v${{ steps.ver.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            dist/ZaloMarketing-Setup-*.exe
            dist/ZaloMarketing-Portable-*.zip
